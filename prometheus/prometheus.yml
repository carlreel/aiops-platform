global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev
    owner: liangchaoyang

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 业务服务：QPS / 延迟 / 召回数 / 上游耗时
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-api:8000"]

  # 主机：CPU / 内存 / 磁盘 / 网络
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # 容器：CPU / 内存 / 重启次数
  # 2026-10-21 暂时关闭：cadvisor 官方镜像在 gcr.io，国内拉不到，
  # 且 registry-mirrors 只加速 Docker Hub、不加速 gcr.io。
  # 启用方式见 docs/部署实录-2026-10-20.md 第七节（换 Docker Hub 等价镜像后再放开）。
